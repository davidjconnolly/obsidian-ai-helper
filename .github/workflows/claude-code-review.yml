name: Claude Code Review

# Thin caller — the review logic lives in davidjconnolly/shared-workflows so
# every repo stays in lockstep. Edit it there, not here.
#
# The `permissions:` block is NOT optional. A reusable workflow cannot hold more
# permission than its caller grants, and this repo's default_workflow_permissions
# is "read" — drop the block and the reviewer is silently capped to read-only:
# the job goes green and no review is ever posted.
#
# Requires repo secret CLAUDE_CODE_OAUTH_TOKEN (fanned out by hermes-config's
# sync-claude-token.yml).

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# One review at a time per PR. The shared workflow's patch-id cache is
# lookup-then-write with no locking, so two rebases seconds apart would both
# miss and both review; this collapses them and drops superseded reviews.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: read
  id-token: write

jobs:
  review:
    uses: davidjconnolly/shared-workflows/.github/workflows/claude-code-review.yml@main
    # Pass the one secret it needs, not `secrets: inherit` — inherit exposes
    # every secret this repo holds to the called workflow, and the reviewer only
    # ever needs the OAuth token.
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
